[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qev-service"
version = "1.0.0"
description = "国际课程质量证据链：内容指纹、版本关系与最小披露的质量证据后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
qev = "service_09252_006.cli:main"

[tool.setuptools.packages.find]
include = ["service_09252_006*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
